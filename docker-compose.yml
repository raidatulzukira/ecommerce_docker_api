  #   ports:
  #     - "8000:8000"
  #   container_name: cart-services
  #   restart: always

  # review-service:
  #   build: ./review-services
  #   ports:
  #     - "5002:5002"
  #   container_name: review-services
  #   restart: always

volumes:
  product-db-data:

# Agar semua container bisa saling komunikasi
networks:
  app-network:
    driver: bridge

